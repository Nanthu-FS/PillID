<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1200" viewBox="0 0 960 1200" font-family="Figtree, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#F1F5F1"/>
      <stop offset="60%" stop-color="#FBF9F3"/>
      <stop offset="100%" stop-color="#F7F4EB"/>
    </radialGradient>
    <linearGradient id="local" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#75A081"/>
      <stop offset="100%" stop-color="#4A6B54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2C3A2E" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7B6C"/>
    </marker>
  </defs>

  <rect width="960" height="1200" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#2C3A2E">PillID — how it works</text>
  <text x="480" y="78" text-anchor="middle" font-size="15" fill="#566153">Local vision · publicly-grounded drug facts · cross-checked interactions</text>

  <!-- Edges (drawn first, under nodes) -->
  <g stroke="#6E7B6C" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <path d="M480,150 L480,176"/>            <!-- User -> Scan -->
    <path d="M480,236 L480,262"/>            <!-- Scan -> identify -->
    <path d="M480,322 L480,350"/>            <!-- identify -> gemma -->
    <path d="M430,452 C380,470 340,476 322,496"/>  <!-- gemma -> RxNorm -->
    <path d="M530,452 C600,470 640,476 660,496"/>  <!-- gemma -> openFDA -->
    <path d="M300,560 C320,584 400,592 452,600"/>  <!-- RxNorm -> Result -->
    <path d="M660,560 C640,584 560,592 508,600"/>  <!-- openFDA -> Result -->
    <path d="M480,656 L480,682"/>            <!-- Result -> Supabase -->
    <path d="M480,742 L480,768"/>            <!-- Supabase -> Cabinet -->
    <path d="M480,828 L480,854"/>            <!-- Cabinet -> interactions -->
    <path d="M430,914 C370,932 330,938 312,958"/>  <!-- interactions -> FDA text -->
    <path d="M400,990 L548,990"/>            <!-- FDA text -> gemma reasoning -->
    <path d="M660,1022 C640,1046 560,1054 508,1062"/> <!-- reasoning -> results -->
  </g>

  <!-- ===== Nodes ===== -->
  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="400" y="102" width="160" height="48" rx="24" fill="#FFFFFF" stroke="#A6C2A9" stroke-width="2"/>
  </g>
  <text x="480" y="131" text-anchor="middle" font-size="16" font-weight="600" fill="#2C3A2E">User · one pill</text>

  <!-- Scan screen -->
  <g filter="url(#shadow)">
    <rect x="340" y="176" width="280" height="60" rx="16" fill="#FFFFFF" stroke="#A6C2A9" stroke-width="2"/>
  </g>
  <text x="480" y="206" text-anchor="middle" font-size="16" font-weight="600" fill="#2C3A2E">Scan screen</text>
  <text x="480" y="225" text-anchor="middle" font-size="12.5" fill="#566153">capture / upload photo</text>

  <!-- /api/identify -->
  <g filter="url(#shadow)">
    <rect x="360" y="262" width="240" height="60" rx="16" fill="#3C5544"/>
  </g>
  <text x="480" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF" font-family="ui-monospace, Menlo, monospace">/api/identify</text>
  <text x="480" y="311" text-anchor="middle" font-size="12" fill="#C7D9C9">vision + enrichment</text>

  <!-- gemma4 vision -->
  <g filter="url(#shadow)">
    <rect x="330" y="350" width="300" height="84" rx="16" fill="url(#local)"/>
  </g>
  <text x="480" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">gemma4:12b · vision (local)</text>
  <text x="480" y="401" text-anchor="middle" font-size="12.5" fill="#E3ECE4">reads imprint · shape · color</text>
  <text x="480" y="419" text-anchor="middle" font-size="12.5" fill="#E3ECE4">best-guess name + confidence</text>

  <!-- RxNorm -->
  <g filter="url(#shadow)">
    <rect x="170" y="496" width="260" height="64" rx="16" fill="#FBF3E2" stroke="#E6C77E" stroke-width="2"/>
  </g>
  <text x="300" y="524" text-anchor="middle" font-size="15" font-weight="600" fill="#92651B">RxNorm · RxNav</text>
  <text x="300" y="544" text-anchor="middle" font-size="12.5" fill="#92651B">name → canonical + rxcui</text>

  <!-- openFDA -->
  <g filter="url(#shadow)">
    <rect x="530" y="496" width="260" height="64" rx="16" fill="#FBF3E2" stroke="#E6C77E" stroke-width="2"/>
  </g>
  <text x="660" y="524" text-anchor="middle" font-size="15" font-weight="600" fill="#92651B">openFDA label</text>
  <text x="660" y="544" text-anchor="middle" font-size="12.5" fill="#92651B">purpose · warnings · interactions</text>

  <!-- Result card -->
  <g filter="url(#shadow)">
    <rect x="340" y="600" width="280" height="56" rx="16" fill="#F1F5F1" stroke="#7BA888" stroke-width="2"/>
  </g>
  <text x="480" y="634" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2F4336">Result — confidence + label</text>

  <!-- Supabase -->
  <g filter="url(#shadow)">
    <rect x="350" y="682" width="260" height="60" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/>
  </g>
  <text x="480" y="710" text-anchor="middle" font-size="15" font-weight="600" fill="#155E75">Supabase (cloud)</text>
  <text x="480" y="730" text-anchor="middle" font-size="12.5" fill="#155E75">medications + pill-images</text>

  <!-- Cabinet -->
  <g filter="url(#shadow)">
    <rect x="360" y="768" width="240" height="60" rx="16" fill="#FFFFFF" stroke="#A6C2A9" stroke-width="2"/>
  </g>
  <text x="480" y="796" text-anchor="middle" font-size="16" font-weight="600" fill="#2C3A2E">Cabinet grid</text>
  <text x="480" y="816" text-anchor="middle" font-size="12.5" fill="#566153">saved medications</text>

  <!-- /api/interactions -->
  <g filter="url(#shadow)">
    <rect x="350" y="854" width="260" height="60" rx="16" fill="#3C5544"/>
  </g>
  <text x="480" y="884" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF" font-family="ui-monospace, Menlo, monospace">/api/interactions</text>
  <text x="480" y="903" text-anchor="middle" font-size="12" fill="#C7D9C9">2+ meds · grounded check</text>

  <!-- openFDA interaction text -->
  <g filter="url(#shadow)">
    <rect x="150" y="958" width="250" height="64" rx="16" fill="#FBF3E2" stroke="#E6C77E" stroke-width="2"/>
  </g>
  <text x="275" y="986" text-anchor="middle" font-size="14.5" font-weight="600" fill="#92651B">openFDA interaction text</text>
  <text x="275" y="1006" text-anchor="middle" font-size="12.5" fill="#92651B">per medication</text>

  <!-- gemma4 reasoning -->
  <g filter="url(#shadow)">
    <rect x="548" y="958" width="262" height="64" rx="16" fill="url(#local)"/>
  </g>
  <text x="679" y="986" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">gemma4:12b · reasoning</text>
  <text x="679" y="1006" text-anchor="middle" font-size="12.5" fill="#E3ECE4">match vs FDA text only</text>

  <!-- Interaction results -->
  <g filter="url(#shadow)">
    <rect x="330" y="1062" width="300" height="60" rx="16" fill="#F1F5F1" stroke="#7BA888" stroke-width="2"/>
  </g>
  <text x="480" y="1090" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2F4336">Interaction results</text>
  <text x="480" y="1110" text-anchor="middle" font-size="12.5" fill="#2F4336">minor · moderate · major</text>

  <!-- Legend -->
  <g transform="translate(150,1155)" font-size="12.5">
    <rect x="0" y="-12" width="16" height="16" rx="4" fill="url(#local)"/>
    <text x="22" y="1" fill="#2C3A2E">On-device (gemma4:12b)</text>
    <rect x="190" y="-12" width="16" height="16" rx="4" fill="#FBF3E2" stroke="#E6C77E" stroke-width="2"/>
    <text x="212" y="1" fill="#2C3A2E">Public data (openFDA · RxNorm)</text>
    <rect x="470" y="-12" width="16" height="16" rx="4" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/>
    <text x="492" y="1" fill="#2C3A2E">Cloud (Supabase)</text>
    <rect x="630" y="-12" width="16" height="16" rx="4" fill="#3C5544"/>
    <text x="652" y="1" fill="#2C3A2E">API route</text>
  </g>
</svg>
